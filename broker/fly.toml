# DEPRECATED: Fly.io retired — broker now runs on the OCI Ampere A1 box behind the shared Cloudflare Tunnel (see broker/DEPLOY-OCI.md); retained for rollback only.
# fly.toml app configuration file generated for vero-baambi-broker on 2026-01-13T03:31:02+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vero-baambi-broker'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  BROKER_PORT = '8765'

[[services]]
  protocol = 'tcp'
  internal_port = 8765

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 500

  [[services.http_checks]]
    interval = '30s'
    timeout = '2s'
    grace_period = '5s'
    method = 'get'
    path = '/health'

[checks]
  [checks.health]
    port = 8765
    type = 'http'
    interval = '30s'
    timeout = '2s'
    grace_period = '10s'
    method = 'get'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
